spring.application.name=cs203

# Server configuration for Hugging Face Spaces
server.port=7860

# Optional: Allow all origins for API access (adjust as needed)
# spring.web.cors.allowed-origins=*
# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Singapore
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Swagger/OpenAPI configuration
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/docs/openapi

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# jwt expiration 1 day (in milliseconds)

# Cookie settings for JWT
cookie.jwt.name=jwt
cookie.path=/
cookie.sameSite=Lax
cookie.secure=false
cookie.httpOnly=true

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.service-token=${SUPABASE_SERVICE_TOKEN}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}

# Multipart file upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
